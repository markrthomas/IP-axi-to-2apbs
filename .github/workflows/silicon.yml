# sky130 silicon run (tapeout-readiness T2/T6): RTL-to-GDS with LibreLane, the
# OpenLane successor. Per top: synthesis, floorplan, PDN, placement, CTS, routing,
# extraction, multi-corner STA against syn/constraints/axi_apb.sdc, DRC, LVS, and
# area/power. Summary in syn/pnr/reports/<top>.pnr.rpt (syn/pnr/summarize.py).
#
# Heavy (Docker + PDK download + P&R), so it runs on demand (Actions → silicon →
# Run workflow) or when a change touches the RTL or the physical-design inputs.
name: silicon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/axi4_to_apb4_2x_*.v'
      - 'syn/constraints/**'
      - 'syn/pnr/**'
      - '.github/workflows/silicon.yml'
  push:
    branches: [main]
    paths:
      - 'src/axi4_to_apb4_2x_*.v'
      - 'syn/constraints/**'
      - 'syn/pnr/**'
      - '.github/workflows/silicon.yml'

permissions:
  contents: read

concurrency:
  group: silicon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnr:
    name: sky130 ${{ matrix.top }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        top: [axi4_to_apb4_2x_simple, axi4_to_apb4_2x_burst]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreLane
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade librelane
          python3 -m librelane --version

      - name: Cache the sky130 PDK (ciel)
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-sky130-${{ runner.os }}-librelane-${{ hashFiles('.github/workflows/silicon.yml') }}

      - name: RTL-to-GDS (LibreLane Classic flow, dockerized)
        run: bash syn/pnr/run_pnr.sh ${{ matrix.top }}

      - name: Upload GDS, netlists, SDF/SPEF, reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky130-${{ matrix.top }}
          path: |
            syn/pnr/reports/${{ matrix.top }}.pnr.rpt
            syn/pnr/${{ matrix.top }}/runs/ci/final/
            syn/pnr/${{ matrix.top }}/runs/ci/resolved.json
            syn/pnr/${{ matrix.top }}/runs/ci/flow.log
            syn/pnr/${{ matrix.top }}/runs/ci/*/*.log
            syn/pnr/${{ matrix.top }}/runs/ci/*-openroad-stapostpnr/**/*.rpt
          if-no-files-found: warn
