name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Lint and directed simulation (make regress)
        run: make regress

  uvm-mirror:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UVM literal mirror check (no VCS required)
        run: make check-uvm-mirror

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verilator coverage (simple + burst bridges)
        run: make coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: |
            coverage_simple.info
            coverage_burst.info
            coverage_regblock.info
          if-no-files-found: ignore

  cocotb:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb==1.9.2 pyuvm==4.0.1

      - name: cocotb OSS UVM-equivalent tests (simple + burst + pyuvm)
        run: make cocotb

  formal:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSS CAD Suite (SymbiYosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Formal verification — simple bridge (depth 30) + burst bridge (depth 50)
        working-directory: verification/formal
        run: make all
