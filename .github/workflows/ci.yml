name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Lint and directed simulation (make regress)
        run: make regress

  uvm-mirror:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UVM literal mirror check (no VCS required)
        run: make check-uvm-mirror

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verilator coverage (simple + burst bridges)
        run: make coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: |
            coverage_simple.info
            coverage_burst.info
          if-no-files-found: ignore

  cocotb:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb==1.8.1

      - name: cocotb OSS UVM-equivalent tests (simple + burst)
        run: make cocotb
