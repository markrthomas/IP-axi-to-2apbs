name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Lint and directed simulation (make regress)
        run: make regress

  uvm-mirror:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: UVM literal mirror check (no VCS required)
        run: make check-uvm-mirror

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verilator coverage (simple + burst bridges)
        run: make coverage

      - name: Generate HTML coverage report
        run: make cov-report

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: |
            coverage_simple.info
            coverage_burst.info
            coverage_regblock.info
          if-no-files-found: ignore

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report.html
          if-no-files-found: ignore

  cocotb:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb==1.9.2 pyuvm==4.0.1

      - name: cocotb OSS UVM-equivalent tests (simple + burst + pyuvm)
        run: make cocotb

  formal:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install OSS CAD Suite (SymbiYosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # authenticated release lookup: avoids the shared-IP API rate limit

      - name: Formal verification — simple bridge (depth 30) + burst bridge (depth 50)
        working-directory: verification/formal
        run: make all

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Modern Yosys via OSS CAD Suite (apt's yosys has different generic cell naming,
      # which broke the flop-count parse; matches the suite used by the other jobs).
      - name: Setup OSS CAD Suite (yosys) — retry transient download flakes
        uses: Wandalen/wretry.action@v3
        with:
          action: YosysHQ/setup-oss-cad-suite@v3
          with: |
            github-token: ${{ github.token }}
          attempt_limit: 3
          attempt_delay: 15000
      - name: T1 synthesizability gate (latch-free, both bridge tops)
        run: make syn

      - name: T4 DFT scan-readiness audit (latch-free + no comb loops + inventory)
        run: make dft

      - name: T3 low-power UPF consistency lint
        run: make lp

      - name: T6 gate-level simulation (netlist GLS, both bridge tops)
        run: make gls

      - name: T6 PPA proxy baseline (cells / flops / logic-depth)
        run: make ppa

      - name: T7 packaging gate (IP-XACT well-formed + structural + in sync with RTL)
        run: |
          command -v xmllint >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
          make pkg

      - name: Restore the IEEE 1685-2014 schema mirror (fixed standard)
        uses: actions/cache/restore@v4
        with:
          path: .cache/ipxact-1685-2014
          key: ipxact-1685-2014-xsd-v2

      - name: T7 IP-XACT full XSD validation (IEEE 1685-2014 schema from Accellera)
        run: make pkg-xsd XSD_HOST_OPTIONAL=1

      - name: Save the schema mirror (only once it is complete)
        if: always() && hashFiles('.cache/ipxact-1685-2014/.complete') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/ipxact-1685-2014
          key: ipxact-1685-2014-xsd-v2
        continue-on-error: true   # key already saved by another run

      - name: T7 release bundle (reproducible build + manifest verify)
        run: |
          make release-check
          mkdir -p dist && cp /tmp/rel-a/* dist/

      - name: Upload release bundle (CI build, version 0.0.0-ci)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/

      - name: Upload sign-off reports (synth / scan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signoff-reports
          path: syn/**/reports/
          if-no-files-found: ignore
