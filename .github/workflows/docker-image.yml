name: Docker image (UVM)

# Heavier gate: actually build the UVM-on-Verilator image and exercise the
# entrypoint end-to-end.  It builds Verilator 5.050 from source (~10 min), so it
# runs only when the container plumbing itself changes (or on manual dispatch) —
# the UVM simulation correctness on every push is already covered by
# verilator-sim.yml, which runs the same tops directly on the runner.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # ubuntu-latest has ~4 vCPU / ~16 GB — VL_BUILD_JOBS=4 speeds the Verilator
      # source compile without OOM (that guard matters on RAM-tight cloud builders).
      - name: Build the UVM image (Verilator built from source)
        run: docker build --build-arg VL_BUILD_JOBS=4 -t ip-axi-2apbs-uvm:ci .

      - name: Entrypoint passthrough (verilator --version)
        run: docker run --rm ip-axi-2apbs-uvm:ci verilator --version

      - name: Resource preflight aborts a heavy target under the floor (expect exit 3)
        run: |
          set +e
          docker run --rm -e UVM_MIN_MEM_MB=99999999 ip-axi-2apbs-uvm:ci make simple
          rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "expected preflight to abort with exit 3, got $rc"; exit 1
          fi
          echo "preflight correctly aborted (exit 3)"

      - name: Entrypoint dispatches a cheap target (make lint) through the real toolchain
        run: docker run --rm ip-axi-2apbs-uvm:ci make lint
